<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Italian Drill</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1a1a2e;
  --card: #16213e;
  --accent: #0f3460;
  --green: #27ae60;
  --red: #c0392b;
  --gold: #f39c12;
  --text: #ecf0f1;
  --muted: #7f8c8d;
  --input-bg: #1e2a45;
  --radius: 10px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
.hidden { display: none !important; }

/* ---- Stats bar ---- */
#stats-bar {
  display: flex;
  justify-content: space-between;
  padding: 8px 16px;
  background: var(--accent);
  font-size: 13px;
  flex-shrink: 0;
}
#stats-bar span { opacity: 0.85; }

/* ---- Screens ---- */
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  max-width: 600px;
  width: 100%;
  margin: 0 auto;
}

/* ---- Settings ---- */
#settings-screen h1 { font-size: 22px; margin-bottom: 16px; text-align: center; }
.setting-group { margin-bottom: 14px; }
.setting-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--muted);
  background: transparent;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: 0.15s;
}
.pill.active { background: var(--accent); border-color: var(--gold); color: var(--gold); }
.pill:hover { border-color: var(--text); }
.tense-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.tense-pill { font-size: 12px; padding: 5px 10px; }
#btn-start {
  margin-top: 20px;
  padding: 14px;
  border: none;
  border-radius: var(--radius);
  background: var(--green);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
}
#btn-start:active { opacity: 0.8; }

/* ---- Drill ---- */
#drill-screen { justify-content: flex-start; padding-top: 24px; }
#tense-label { font-size: 12px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
#verb-acc { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
#prompt {
  font-size: 20px;
  line-height: 1.5;
  margin-bottom: 20px;
  min-height: 60px;
}
#answer-input {
  width: 100%;
  padding: 14px;
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  background: var(--input-bg);
  color: var(--text);
  font-size: 17px;
  outline: none;
  transition: border-color 0.2s;
}
#answer-input:focus { border-color: var(--gold); }
#answer-input.correct { border-color: var(--green); }
#answer-input.wrong { border-color: var(--red); }

#feedback {
  margin-top: 12px;
  min-height: 70px;
  font-size: 15px;
  line-height: 1.5;
}
#feedback .fb-correct { color: var(--green); font-weight: 600; }
#feedback .fb-wrong { color: var(--red); font-weight: 600; }
#feedback .fb-expected { color: var(--muted); font-size: 14px; margin-top: 4px; }
#feedback .fb-hint { color: var(--gold); font-size: 13px; margin-top: 4px; }
#feedback .fb-correction { color: var(--gold); font-size: 14px; margin-top: 4px; }

.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.btn-row button {
  flex: 1;
  padding: 10px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: transparent;
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
}
.btn-row button:active { opacity: 0.7; }
.btn-row button.primary {
  background: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
}

/* ---- Stats page ---- */
#stats-screen { overflow-y: auto; }
#stats-screen h2 { font-size: 18px; margin: 16px 0 8px; color: var(--gold); }
#stats-screen table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 8px; }
#stats-screen th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--accent); }
#stats-screen td { padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.05); }
#btn-back-stats {
  margin-top: 16px;
  padding: 12px;
  border: none;
  border-radius: var(--radius);
  background: var(--accent);
  color: var(--text);
  font-size: 15px;
  cursor: pointer;
  width: 100%;
}

/* ---- Quit summary ---- */
#quit-screen { justify-content: center; align-items: center; text-align: center; }
#quit-screen h2 { font-size: 22px; margin-bottom: 16px; }
#quit-summary { font-size: 16px; line-height: 2; }
#btn-restart {
  margin-top: 24px;
  padding: 14px 40px;
  border: none;
  border-radius: var(--radius);
  background: var(--green);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- Stats bar -->
<div id="stats-bar" class="hidden">
  <span>Q: <b id="sb-total">0</b></span>
  <span>Acc: <b id="sb-acc">0%</b></span>
  <span id="sb-time">0m</span>
</div>

<!-- ========== SETTINGS SCREEN ========== -->
<div id="settings-screen" class="screen">
  <h1>Italian Drill</h1>

  <div class="setting-group">
    <label>Mode</label>
    <div class="pill-row">
      <button class="pill active" data-mode="all">All verbs</button>
      <button class="pill" data-mode="non_mastered">Non-mastered</button>
      <button class="pill" data-mode="review">Review mastered</button>
    </div>
  </div>

  <div class="setting-group">
    <label>Focus</label>
    <div class="pill-row">
      <button class="pill active" data-focus="all">All</button>
      <button class="pill" data-focus="pronouns">Pronouns</button>
      <button class="pill" data-focus="agreement">Agreement</button>
      <button class="pill" data-focus="conjugation-endings">Endings</button>
    </div>
  </div>

  <div class="setting-group">
    <label>Gender (io/tu)</label>
    <div class="pill-row">
      <button class="pill active" data-gender="m">Masculine</button>
      <button class="pill" data-gender="f">Feminine</button>
    </div>
  </div>

  <div class="setting-group">
    <label>Tenses</label>
    <div class="tense-grid" id="tense-grid">
      <button class="pill tense-pill active" data-tense="presente">Present</button>
      <button class="pill tense-pill active" data-tense="imperfetto">Imperfect</button>
      <button class="pill tense-pill active" data-tense="futuro">Future</button>
      <button class="pill tense-pill active" data-tense="condizionale">Conditional</button>
      <button class="pill tense-pill active" data-tense="passato_prossimo">Passato Prossimo</button>
    </div>
  </div>

  <button id="btn-start">Start Drill</button>
</div>

<!-- ========== DRILL SCREEN ========== -->
<div id="drill-screen" class="screen hidden">
  <div id="tense-label"></div>
  <div id="verb-acc"></div>
  <div id="prompt"></div>

  <input type="text" id="answer-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type Italian translation...">

  <div id="feedback"></div>

  <div class="btn-row">
    <button id="btn-hint">Hint</button>
    <button id="btn-flag">Flag</button>
    <button id="btn-stats-open">Stats</button>
    <button id="btn-quit">Quit</button>
  </div>
  <div class="btn-row hidden" id="next-row">
    <button id="btn-next" class="primary">Next &rarr;</button>
  </div>
</div>

<!-- ========== STATS SCREEN ========== -->
<div id="stats-screen" class="screen hidden">
  <h2>Session</h2>
  <div id="stats-session"></div>

  <h2>Weakest Verbs</h2>
  <table id="stats-weakest"><thead><tr><th>Verb</th><th>Acc</th><th>Attempts</th></tr></thead><tbody></tbody></table>

  <h2>Mastered Verbs</h2>
  <table id="stats-mastered"><thead><tr><th>Verb</th><th>Attempts</th><th>Mastery</th></tr></thead><tbody></tbody></table>

  <h2>Tense Accuracy</h2>
  <table id="stats-tense"><thead><tr><th>Tense</th><th>Acc</th><th>Attempts</th></tr></thead><tbody></tbody></table>

  <h2>Weakest Combos</h2>
  <table id="stats-combo"><thead><tr><th>Combo</th><th>Acc</th><th>Attempts</th></tr></thead><tbody></tbody></table>

  <div style="margin-top:8px; font-size:13px; color:var(--muted);">
    Lifetime: <span id="stats-lifetime"></span> | Session: <span id="stats-session-time"></span>
  </div>

  <button id="btn-back-stats">Back to Drill</button>
</div>

<!-- ========== QUIT SCREEN ========== -->
<div id="quit-screen" class="screen hidden">
  <h2>Session Complete</h2>
  <div id="quit-summary"></div>
  <button id="btn-restart">New Session</button>
</div>

<script>
(function() {
  "use strict";

  // --- DOM refs ---
  const $  = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  const statsBar      = $("#stats-bar");
  const settingsScr   = $("#settings-screen");
  const drillScr      = $("#drill-screen");
  const statsScr      = $("#stats-screen");
  const quitScr       = $("#quit-screen");

  const tenseLabel    = $("#tense-label");
  const verbAcc       = $("#verb-acc");
  const prompt        = $("#prompt");
  const input         = $("#answer-input");
  const feedback      = $("#feedback");
  const nextRow       = $("#next-row");

  // --- State ---
  let currentSpec  = null;
  let hintUsed     = false;
  let inCorrection = false;
  let answered     = false;

  // --- Helpers ---
  function show(el)  { el.classList.remove("hidden"); }
  function hide(el)  { el.classList.add("hidden"); }

  async function post(url, body) {
    const res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body || {}),
    });
    return res.json();
  }

  function updateStatsBar(s) {
    if (!s) return;
    $("#sb-total").textContent = s.total;
    $("#sb-acc").textContent   = s.accuracy + "%";
    $("#sb-time").textContent  = s.elapsed;
  }

  function showScreen(scr) {
    [settingsScr, drillScr, statsScr, quitScr].forEach(hide);
    show(scr);
    if (scr === drillScr || scr === statsScr) show(statsBar);
    else hide(statsBar);
  }

  function showSpec(spec) {
    currentSpec  = spec;
    hintUsed     = false;
    inCorrection = false;
    answered     = false;

    tenseLabel.textContent = spec.tense_label;
    verbAcc.textContent    = "Verb: " + spec.verb + " (" + spec.verb_acc + ")";
    prompt.textContent     = spec.english_prompt;

    input.value = "";
    input.className = "";
    input.disabled = false;
    input.placeholder = "Type Italian translation...";
    feedback.innerHTML = "";
    hide(nextRow);
    input.focus();
  }

  // --- Pill selectors ---
  function initPills(selector, multi) {
    $$(selector).forEach(function(btn) {
      btn.addEventListener("click", function() {
        if (multi) {
          btn.classList.toggle("active");
        } else {
          btn.parentElement.querySelectorAll(".pill").forEach(function(p) { p.classList.remove("active"); });
          btn.classList.add("active");
        }
      });
    });
  }

  initPills("[data-mode]", false);
  initPills("[data-focus]", false);
  initPills("[data-gender]", false);
  initPills("[data-tense]", true);

  // --- Start ---
  $("#btn-start").addEventListener("click", async function() {
    var mode   = $("[data-mode].active").dataset.mode;
    var focus  = $("[data-focus].active").dataset.focus;
    var gender = $("[data-gender].active").dataset.gender;
    var tenses = [];
    $$("[data-tense].active").forEach(function(p) { tenses.push(p.dataset.tense); });
    if (tenses.length === 0) tenses = ["presente","imperfetto","futuro","condizionale","passato_prossimo"];

    var data = await post("/settings", {
      mode: mode,
      focus_mode: focus,
      gender_io_tu: gender,
      allowed_tenses: tenses,
    });

    updateStatsBar(data.stats);
    showScreen(drillScr);
    showSpec(data.spec);
  });

  // --- Submit answer ---
  input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      if (answered && !inCorrection) {
        // same as clicking Next
        doNext();
      } else {
        doSubmit();
      }
    }
  });

  async function doSubmit() {
    var val = input.value.trim();
    if (!val) return;

    var data = await post("/answer", {
      answer: val,
      hint_used: hintUsed,
    });

    updateStatsBar(data.stats);

    if (data.correction) {
      // In correction loop
      inCorrection = true;
      if (data.correct === false) {
        // wrong during correction
        input.className = "wrong";
        feedback.innerHTML =
          '<div class="fb-wrong">Try again</div>' +
          '<div class="fb-expected">Expected: ' + esc(data.expected_normalized) + '</div>' +
          '<div class="fb-correction">Correction: ' + data.reps + '/3</div>';
        input.value = "";
        input.focus();
      } else if (data.correction_done) {
        // done with corrections
        inCorrection = false;
        answered = true;
        input.className = "correct";
        input.disabled = true;
        feedback.innerHTML = '<div class="fb-correct">Correction complete (' + data.reps + '/3)</div>';
        show(nextRow);
      } else {
        // correct rep but not done
        input.className = "correct";
        feedback.innerHTML =
          '<div class="fb-correct">Good!</div>' +
          '<div class="fb-correction">Correction: ' + data.reps + '/3</div>';
        input.value = "";
        input.focus();
      }
      return;
    }

    if (data.correct) {
      answered = true;
      input.className = "correct";
      input.disabled = true;
      feedback.innerHTML = '<div class="fb-correct">Correct!</div>';
      show(nextRow);
    } else {
      // Wrong answer - enter correction mode
      inCorrection = true;
      input.className = "wrong";
      var html = '<div class="fb-wrong">Incorrect</div>';
      html += '<div class="fb-expected">Expected: ' + esc(data.expected_normalized) + '</div>';
      if (data.hint) {
        html += '<div class="fb-hint">Hint: ' + esc(data.hint) + '</div>';
      }
      html += '<div class="fb-correction">Type the correct answer 3 times (0/3)</div>';
      feedback.innerHTML = html;
      input.value = "";
      input.focus();
    }
  }

  async function doNext() {
    var data = await post("/next");
    updateStatsBar(data.stats);
    showSpec(data.spec);
  }

  $("#btn-next").addEventListener("click", doNext);

  // --- Hint ---
  $("#btn-hint").addEventListener("click", async function() {
    hintUsed = true;
    var data = await post("/hint");
    if (data.hint) {
      var existing = feedback.innerHTML;
      feedback.innerHTML = existing + '<div class="fb-hint">Hint: ' + esc(data.hint) + '</div>';
    }
    input.focus();
  });

  // --- Flag ---
  $("#btn-flag").addEventListener("click", async function() {
    var data = await post("/flag");
    updateStatsBar(data.stats);
    showSpec(data.spec);
  });

  // --- Stats ---
  $("#btn-stats-open").addEventListener("click", async function() {
    var res = await fetch("/stats");
    var data = await res.json();

    updateStatsBar(data.session_stats);

    // Session summary
    var s = data.session_stats;
    $("#stats-session").innerHTML =
      "Questions: " + s.total + " | Correct: " + s.correct + " | Accuracy: " + s.accuracy + "%";

    // Weakest
    var tb = $("#stats-weakest tbody");
    tb.innerHTML = "";
    (data.weakest || []).forEach(function(v) {
      tb.innerHTML += "<tr><td>" + esc(v.verb) + " (" + esc(v.en) + ")</td><td>" +
        (v.accuracy !== null ? v.accuracy + "%" : "-") + "</td><td>" + v.total + "</td></tr>";
    });

    // Mastered
    tb = $("#stats-mastered tbody");
    tb.innerHTML = "";
    (data.mastered || []).forEach(function(v) {
      tb.innerHTML += "<tr><td>" + esc(v.verb) + " (" + esc(v.en) + ")</td><td>" +
        v.total + "</td><td>" + v.mastery_count + "</td></tr>";
    });

    // Tense
    tb = $("#stats-tense tbody");
    tb.innerHTML = "";
    (data.tense_stats || []).forEach(function(t) {
      tb.innerHTML += "<tr><td>" + esc(t.tense) + "</td><td>" +
        t.accuracy + "%</td><td>" + t.attempts + "</td></tr>";
    });

    // Combos
    tb = $("#stats-combo tbody");
    tb.innerHTML = "";
    (data.combo_stats || []).forEach(function(c) {
      tb.innerHTML += "<tr><td>" + esc(c.combo) + "</td><td>" +
        c.accuracy + "%</td><td>" + c.attempts + "</td></tr>";
    });

    $("#stats-lifetime").textContent = data.lifetime;
    $("#stats-session-time").textContent = data.session;

    showScreen(statsScr);
  });

  $("#btn-back-stats").addEventListener("click", function() {
    showScreen(drillScr);
    input.focus();
  });

  // --- Quit ---
  $("#btn-quit").addEventListener("click", async function() {
    if (!confirm("End this session?")) return;
    var data = await post("/quit");
    var html = "<p>Questions: <b>" + data.total + "</b></p>";
    html += "<p>Correct: <b>" + data.correct + "</b></p>";
    html += "<p>Accuracy: <b>" + data.accuracy + "%</b></p>";
    html += "<p>Session time: <b>" + data.session_time + "</b></p>";
    html += "<p>Lifetime: <b>" + data.lifetime + "</b></p>";
    if (data.sync) html += "<p style='color:var(--muted);font-size:13px;'>" + esc(data.sync) + "</p>";
    $("#quit-summary").innerHTML = html;
    showScreen(quitScr);
  });

  // --- Restart ---
  $("#btn-restart").addEventListener("click", function() {
    showScreen(settingsScr);
  });

  // --- Escape helper ---
  function esc(s) {
    if (!s) return "";
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

})();
</script>
</body>
</html>
